<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аудио в текст</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }
  button {
    font-size: 18px;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin: 10px;
  }
  #startBtn { background: #2e7d32; color: white; }
  #stopBtn { background: #c62828; color: white; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 20px;
    padding: 15px;
    min-height: 150px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: left;
    white-space: pre-wrap;
    font: inherit;
    resize: vertical;
  }
  #status { color: #666; margin-top: 10px; }
</style>
</head>
<body>

<h1>Аудио в текст</h1>
<p>Нажмите «Начать запись», говорите — текст появится ниже. Текст можно редактировать вручную.</p>

<button id="startBtn">🎙️ Начать запись</button>
<button id="stopBtn" disabled>⏹️ Остановить</button>

<div id="status"></div>
<textarea id="result" placeholder="Здесь появится распознанный текст..."></textarea>

<script>
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    status.textContent = 'Ваш браузер не поддерживает распознавание речи. Попробуйте Google Chrome.';
    startBtn.disabled = true;
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;

    let finalText = '';

    recognition.onresult = (event) => {
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript + ' ';
        } else {
          interimText += transcript;
        }
      }
      result.value = finalText + interimText;
    };

    recognition.onerror = (event) => {
      status.textContent = 'Ошибка: ' + event.error;
    };

    recognition.onend = () => {
      if (!stopBtn.disabled) {
        recognition.start();
      }
    };

    startBtn.onclick = () => {
      finalText = result.value ? result.value + ' ' : '';
      status.textContent = 'Идёт запись...';
      recognition.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      stopBtn.disabled = true;
      startBtn.disabled = false;
      recognition.stop();
      status.textContent = 'Остановлено.';
    };
  }
</script>

</body>
</html>
